<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Dashboard - QueueLess</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        background: #f4f7fb;
        color: #263445;
      }

      header {
        background: #fff;
        color: black;
        padding: 20px 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h2 {
        margin: 0;
      }

      button {
        border: none;
        padding: 11px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }

      .logout {
        background: white;
        color: #173b63;
      }

      main {
        max-width: 1100px;
        margin: 35px auto;
        padding: 0 20px;
      }

      .welcome {
        margin-bottom: 25px;
      }

      .welcome h1 {
        margin-bottom: 8px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-bottom: 25px;
      }

      .card {
        background: white;
        padding: 22px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }

      .card p {
        color: #64748b;
        margin: 0 0 10px;
      }

      .card h2 {
        margin: 0;
        font-size: 30px;
      }

      .section {
        background: white;
        padding: 25px;
        border-radius: 10px;
        margin-bottom: 25px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }

      .section h2 {
        margin-top: 0;
      }

      form {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      input {
        flex: 1;
        min-width: 200px;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
      }

      .primary {
        background: #1769aa;
        color: white;
      }

      .success {
        background: #16834a;
        color: white;
      }

      .complete {
        background: #64748b;
        color: white;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .queue-actions {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 600px;
      }

      th,
      td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
      }

      th {
        background: #f8fafc;
      }

      .status {
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 12px;
        background: #e2e8f0;
      }

      .waiting {
        background: #fef3c7;
        color: #92400e;
      }

      .serving {
        background: #dcfce7;
        color: #166534;
      }

      .completed {
        background: #e2e8f0;
        color: #475569;
      }

      #message {
        margin-top: 15px;
        font-size: 14px;
      }

      @media (max-width: 700px) {
        .cards {
          grid-template-columns: 1fr;
        }

        header {
          padding: 18px 20px;
        }

        form {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h2>QueueLess Staff</h2>
      <button class="logout" id="logoutBtn">Logout</button>
    </header>
    <main>
      <div class="welcome">
        <h1 id="welcomeMessage">Welcome, Staff</h1>
        <p>Manage patient queues and appointments.</p>
      </div>
      <div class="cards">
        <div class="card">
          <p>Waiting Patients</p>
          <h2 id="waitingCount">0</h2>
        </div>
        <div class="card">
          <p>Currently Serving</p>
          <h2 id="servingNumber">None</h2>
        </div>

        <div class="card">
          <p>Completed Today</p>
          <h2 id="completedCount">0</h2>
        </div>
      </div>
      <div class="section">
        <h2>Add Patient to Queue</h2>
        <form id="queueForm">
          <input
            type="text"
            id="patientName"
            placeholder="Enter patient's name"
            maxlength="80"
            required
          />

          <button type="submit" class="primary" id="addBtn">
            Add to Queue
          </button>
        </form>

        <p id="message"></p>
      </div>
      <div class="section">
        <h2>Queue Management</h2>
        <div class="queue-actions">
          <button class="success" id="callNextBtn">Call Next Patient</button>
          <button class="complete" id="completeBtn" disabled>
            Complete Current Patient
          </button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Queue Number</th>
                <th>Patient Name</th>
                <th>Status</th>
                <th>Time Added</th>
              </tr>
            </thead>

            <tbody id="queueTable">
              <tr>
                <td colspan="4">Loading queue...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

      import {
        getAuth,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

      import {
        getFirestore,
        doc,
        getDoc,
        collection,
        addDoc,
        getDocs,
        query,
        where,
        serverTimestamp,
        runTransaction,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBguotQzZiq8tfJ7f2KKEK9mslBOySQg6c",
        authDomain: "queueless-c563d.firebaseapp.com",
        projectId: "queueless-c563d",
        storageBucket: "queueless-c563d.firebasestorage.app",
        messagingSenderId: "529656062517",
        appId: "1:529656062517:web:034a5dcac0f6bc5c75877c",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let currentStaffId = null;
      let queueEntries = [];

      async function recordSecurityEvent(eventName, details) {
        try {
          await addDoc(collection(db, "securityLogs"), {
            uid: currentStaffId,
            role: "staff",
            event: eventName,
            details: details,
            timestamp: serverTimestamp(),
          });
        } catch (error) {
          console.error("Security logging error:", error);
        }
      }

      const today = () => {
        const date = new Date();
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
      };

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "login.html";
          return;
        }

        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));

          if (
            !userDoc.exists() ||
            userDoc.data().role !== "staff" ||
            userDoc.data().status !== "active"
          ) {
            await signOut(auth);
            window.location.href = "login.html";
            return;
          }

          currentStaffId = user.uid;

          const name = userDoc.data().name || "Staff";
          document.getElementById("welcomeMessage").textContent =
            `Welcome, ${name}`;

          sessionStorage.setItem("queueLessStaffId", user.uid);

          await loadQueue();
        } catch (error) {
          console.error(error);
          alert("Unable to load staff dashboard.");
        }
      });

      async function loadQueue() {
        const queueQuery = query(
          collection(db, "queue"),
          where("queueDate", "==", today()),
        );

        const snapshot = await getDocs(queueQuery);

        queueEntries = snapshot.docs.map((item) => ({
          id: item.id,
          ...item.data(),
        }));

        queueEntries.sort((a, b) => {
          const timeA = a.createdAt?.toMillis?.() || 0;
          const timeB = b.createdAt?.toMillis?.() || 0;
          return timeA - timeB;
        });

        displayQueue();
      }

      function displayQueue() {
        const table = document.getElementById("queueTable");

        const waiting = queueEntries.filter(
          (item) => item.status === "waiting",
        );

        const serving = queueEntries.find((item) => item.status === "serving");

        const completed = queueEntries.filter(
          (item) => item.status === "completed",
        );

        document.getElementById("waitingCount").textContent = waiting.length;

        document.getElementById("servingNumber").textContent = serving
          ? serving.queueNumber
          : "None";

        document.getElementById("completedCount").textContent =
          completed.length;

        document.getElementById("completeBtn").disabled = !serving;
        document.getElementById("callNextBtn").disabled =
          waiting.length === 0 || !!serving;

        table.replaceChildren();

        if (queueEntries.length === 0) {
          const row = document.createElement("tr");
          const cell = document.createElement("td");

          cell.colSpan = 4;
          cell.textContent = "No patients in the queue today.";

          row.appendChild(cell);
          table.appendChild(row);
          return;
        }

        queueEntries.forEach((item) => {
          const row = document.createElement("tr");

          const numberCell = document.createElement("td");
          numberCell.textContent = item.queueNumber;

          const nameCell = document.createElement("td");
          nameCell.textContent = item.patientName;

          const statusCell = document.createElement("td");
          const statusLabel = document.createElement("span");

          statusLabel.className = `status ${item.status}`;
          statusLabel.textContent =
            item.status.charAt(0).toUpperCase() + item.status.slice(1);

          statusCell.appendChild(statusLabel);

          const timeCell = document.createElement("td");

          if (item.createdAt?.toDate) {
            timeCell.textContent = item.createdAt.toDate().toLocaleTimeString();
          } else {
            timeCell.textContent = "Just now";
          }

          row.append(numberCell, nameCell, statusCell, timeCell);
          table.appendChild(row);
        });
      }

      document
        .getElementById("queueForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const nameInput = document.getElementById("patientName");
          const name = nameInput.value.trim();
          const message = document.getElementById("message");
          const addBtn = document.getElementById("addBtn");

          const namePattern = /^[A-Za-z\s'-]+$/;

          if (name.length < 2 || !namePattern.test(name)) {
            message.textContent =
              "Enter a valid name using letters, spaces, hyphens or apostrophes.";
            message.style.color = "red";
            return;
          }

          addBtn.disabled = true;
          message.textContent = "Adding patient...";
          message.style.color = "#475569";

          try {
            const counterRef = doc(db, "counters", "dailyQueue");
            let nextNumber;

            await runTransaction(db, async (transaction) => {
              const counterDoc = await transaction.get(counterRef);

              if (!counterDoc.exists() || counterDoc.data().date !== today()) {
                nextNumber = 1;

                transaction.set(counterRef, {
                  date: today(),
                  lastNumber: 1,
                });
              } else {
                nextNumber = counterDoc.data().lastNumber + 1;

                transaction.update(counterRef, {
                  lastNumber: nextNumber,
                });
              }
            });

            const queueNumber = `Q${String(nextNumber).padStart(3, "0")}`;

            await addDoc(collection(db, "queue"), {
              patientName: name,
              patientUid: null,
              queueNumber: queueNumber,
              queueDate: today(),
              status: "waiting",
              source: "staff",
              createdBy: currentStaffId,
              createdAt: serverTimestamp(),
            });

            await recordSecurityEvent(
              "Patient Added to Queue",
              `Staff added ${name} to the queue with number ${queueNumber}.`,
            );

            nameInput.value = "";

            message.textContent = `Patient added successfully. Queue number: ${queueNumber}`;
            message.style.color = "green";

            await loadQueue();
          } catch (error) {
            console.error(error);
            message.textContent = "Unable to add patient. Please try again.";
            message.style.color = "red";
          } finally {
            addBtn.disabled = false;
          }
        });

      document
        .getElementById("callNextBtn")
        .addEventListener("click", async () => {
          const nextPatient = queueEntries.find(
            (item) => item.status === "waiting",
          );

          if (!nextPatient) return;

          try {
            await updateDoc(doc(db, "queue", nextPatient.id), {
              status: "serving",
              calledAt: serverTimestamp(),
              calledBy: currentStaffId,
            });

            await recordSecurityEvent(
              "Next Patient Called",
              `Staff called queue number ${nextPatient.queueNumber}.`,
            );

            await loadQueue();
          } catch (error) {
            console.error(error);
            alert("Unable to call the next patient.");
          }
        });

      document
        .getElementById("completeBtn")
        .addEventListener("click", async () => {
          const servingPatient = queueEntries.find(
            (item) => item.status === "serving",
          );

          if (!servingPatient) return;

          try {
            await updateDoc(doc(db, "queue", servingPatient.id), {
              status: "completed",
              completedAt: serverTimestamp(),
              completedBy: currentStaffId,
            });

            await recordSecurityEvent(
              "Patient Visit Completed",
              `Staff completed queue number ${servingPatient.queueNumber}.`,
            );

            await loadQueue();
          } catch (error) {
            console.error(error);
            alert("Unable to complete this patient.");
          }
        });

      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          try {
            await recordSecurityEvent(
              "User Logout",
              "Staff logged out successfully.",
            );

            await signOut(auth);
            sessionStorage.removeItem("queueLessStaffId");
            window.location.href = "login.html";
          } catch (error) {
            console.error("Logout error:", error);
            alert("Logout failed. Please try again.");
          }
        });
    </script>
  </body>
</html>
