<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QueueLess - Security Logs</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        background: #e9e9e9;
        color: #000;
        min-height: 100vh;
      }

      header {
        background: #fff;
        padding: 20px 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #29364a;
      }

      header h2 {
        color: #000;
      }

      .header-buttons {
        display: flex;
        gap: 10px;
      }

      button {
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }

      .back-button {
        background: #334155;
        color: white;
      }

      .logout-button {
        background: #dc2626;
        color: white;
      }

      main {
        width: 90%;
        max-width: 1200px;
        margin: 40px auto;
      }

      .page-heading {
        margin-bottom: 25px;
      }

      .page-heading h1 {
        margin-bottom: 8px;
      }

      .page-heading p {
        color: #000;
      }

      .log-panel {
        background: #e9e9e9;
        border: 1px solid #29364a;
        border-radius: 10px;
        padding: 25px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        gap: 15px;
      }

      .refresh-button {
        background: #000;
        color: white;
      }

      .table-container {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 750px;
      }

      th,
      td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #29364a;
        font-size: 14px;
      }

      th {
        color: #000;
        background: #fff;
      }

      td {
        color: #000;
      }

      .event-name {
        font-weight: bold;
        color: #000;
      }

      #status_message {
        color: #000;
        padding: 20px 0;
        text-align: center;
      }

      #events_count {
        color: #000;
        font-weight: bold;
      }

      @media (max-width: 600px) {
        header {
          flex-direction: column;
          gap: 15px;
        }

        main {
          width: 94%;
          margin: 25px auto;
        }

        .log-panel {
          padding: 15px;
        }

        .panel-header {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h2>QueueLess Security</h2>

      <div class="header-buttons">
        <button class="back-button" id="back_button">Admin Dashboard</button>
      </div>
    </header>

    <main>
      <div class="page-heading">
        <h1>Security Logs</h1>
        <p>Monitor security-related activities within QueueLess.</p>
      </div>

      <div class="log-panel">
        <div class="panel-header">
          <div>
            <h3>Recorded Events</h3>
            <p style="color: #000; margin-top: 6px">
              Events loaded: <span id="events_count">0</span>
            </p>
          </div>

          <button class="refresh-button" id="refresh_button">
            Refresh Logs
          </button>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date & Time</th>
                <th>Event</th>
                <th>Role</th>
                <th>User ID</th>
                <th>Details</th>
              </tr>
            </thead>

            <tbody id="logs_table_body"></tbody>
          </table>
        </div>

        <p id="status_message">Loading security logs...</p>
      </div>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

      import {
        getAuth,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

      import {
        getFirestore,
        doc,
        getDoc,
        collection,
        getDocs,
        query,
        orderBy,
        limit,
      } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBguotQzZiq8tfJ7f2KKEK9mslBOySQg6c",
        authDomain: "queueless-c563d.firebaseapp.com",
        projectId: "queueless-c563d",
        storageBucket: "queueless-c563d.firebasestorage.app",
        messagingSenderId: "529656062517",
        appId: "1:529656062517:web:034a5dcac0f6bc5c75877c",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const tableBody = document.getElementById("logs_table_body");
      const statusMessage = document.getElementById("status_message");
      const eventsCount = document.getElementById("events_count");

      async function loadSecurityLogs() {
        tableBody.replaceChildren();
        statusMessage.textContent = "Loading security logs...";
        eventsCount.textContent = "0";

        try {
          const logsQuery = query(
            collection(db, "securityLogs"),
            orderBy("timestamp", "desc"),
            limit(100),
          );

          const logsSnapshot = await getDocs(logsQuery);

          if (logsSnapshot.empty) {
            statusMessage.textContent =
              "No security events have been recorded yet.";
            return;
          }

          logsSnapshot.forEach((logDocument) => {
            const log = logDocument.data();

            const row = document.createElement("tr");

            let formattedDate = "Not available";

            if (log.timestamp && typeof log.timestamp.toDate === "function") {
              formattedDate = log.timestamp.toDate().toLocaleString();
            } else if (log.timestamp) {
              formattedDate = new Date(log.timestamp).toLocaleString();
            }

            const values = [
              formattedDate,
              log.event || "Unknown event",
              log.role || "Unknown",
              log.uid || "Unknown",
              log.details || "-",
            ];

            values.forEach((value, index) => {
              const cell = document.createElement("td");
              cell.textContent = String(value);

              if (index === 1) {
                cell.classList.add("event-name");
              }

              row.appendChild(cell);
            });

            tableBody.appendChild(row);
          });

          eventsCount.textContent = logsSnapshot.size;
          statusMessage.textContent = "Security logs loaded successfully.";
        } catch (error) {
          console.error("Security logs error:", error);
          statusMessage.textContent =
            "Unable to load security logs. Please check your Firestore permissions.";
        }
      }

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "login.html";
          return;
        }

        try {
          const userDocument = await getDoc(doc(db, "users", user.uid));

          if (!userDocument.exists()) {
            await signOut(auth);
            window.location.href = "login.html";
            return;
          }

          const userData = userDocument.data();

          if (userData.role !== "admin" || userData.status !== "active") {
            await signOut(auth);
            alert("You are not authorised to access Security Logs.");
            window.location.href = "login.html";
            return;
          }

          sessionStorage.setItem("queueLessAdminId", user.uid);

          await loadSecurityLogs();
        } catch (error) {
          console.error("Security Logs access error:", error);
          alert("Unable to verify administrator access.");
          window.location.href = "login.html";
        }
      });

      document
        .getElementById("refresh_button")
        .addEventListener("click", () => {
          loadSecurityLogs();
        });

      document.getElementById("back_button").addEventListener("click", () => {
        window.location.href = "admin-dashboard.html";
      });

      document
        .getElementById("logout_button")
        .addEventListener("click", async () => {
          try {
            await signOut(auth);
            sessionStorage.removeItem("queueLessAdminId");
            window.location.href = "login.html";
          } catch (error) {
            console.error("Logout error:", error);
            alert("Logout failed. Please try again.");
          }
        });
    </script>
  </body>
</html>
